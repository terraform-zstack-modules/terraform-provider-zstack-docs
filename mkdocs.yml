site_name: Terraform Provider ZStack Docs
site_description: Guides and examples for managing ZStack resources with Terraform.
repo_name: terraform-provider-zstack-docs
docs_dir: docs
site_dir: site
exclude_docs: |
  ../internal/**
  ../skills/**
  ../website/**
  ../assets/**/*.md
  ../.claude/**
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://unpkg.com/mermaid@10.9.3/dist/mermaid.min.js
  - javascripts/mermaid.js
nav:
  - Home: index.md
  - 中文:
      - 概览: zh/index.md
      - 客户使用手册:
          - 概览: zh/manual/index.md
          - 安装与环境准备: zh/manual/install-environment.md
          - 快速开始: zh/manual/getting-started.md
          - Provider 初始化与离线 Mirror: zh/manual/provider-init-mirror.md
          - 认证与 Provider 配置: zh/manual/authentication.md
          - Terraform 运行流程: zh/manual/terraform-workflow.md
          - 概念映射: zh/manual/concepts.md
          - 工作原理: zh/manual/how-it-works.md
          - HCL 编写规范: zh/manual/hcl-style.md
